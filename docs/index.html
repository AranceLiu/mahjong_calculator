              <div id="playerCard-3" class="border border-gray-200 bg-white shadow-sm rounded-lg p-3 flex flex-col justify-center md:col-start-1 md:row-start-2">

              <div class="hidden md:flex md:col-start-2 md:row-start-2 items-center justify-center">
                <div class="relative w-72 h-72 rounded-xl bg-emerald-700 shadow-inner">
                  <div class="absolute top-2 left-6 right-6 h-4 flex gap-0.5">
                    <div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div>

                  <div class="absolute bottom-2 left-6 right-6 h-4 flex gap-0.5">
                    <div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div>

                  <div class="absolute left-2 top-6 bottom-6 w-4 flex flex-col gap-0.5">
                    <div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div>

                  <div class="absolute right-2 top-6 bottom-6 w-4 flex flex-col gap-0.5">
                    <div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div><div class="flex-1 rounded-sm bg-gray-50 border border-gray-300"></div>
                  </div>
                  <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-14 h-14 rounded-lg bg-white text-red-700 flex items-center justify-center text-3xl shadow">🀄</div>

        </div>

        <aside class="lg:w-80 flex-shrink-0 mt-8 lg:mt-0 space-y-4">
          <div class="border rounded-lg p-4 bg-white shadow-sm space-y-3">
            <h2 class="font-semibold">本局結算</h2>

            <div>
              <label class="text-xs text-gray-500 block mb-1">台數</label>
              <input type="number" min="0" id="taiInput" placeholder="幾台？" class="w-full border rounded px-2 py-1 text-sm" />
            </div>

            <div>
              <div class="text-xs text-gray-500 mb-1">胡牌的人</div>
              <div class="flex flex-col gap-1">
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="winner" value="0" class="winnerRadio" /><span data-role="name">玩家1</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="winner" value="1" class="winnerRadio" /><span data-role="name">玩家2</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="winner" value="2" class="winnerRadio" /><span data-role="name">玩家3</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="winner" value="3" class="winnerRadio" /><span data-role="name">玩家4</span></label>
              </div>
            </div>

            <div>
              <div class="text-xs text-gray-500 mb-1">胡牌方式</div>
              <label class="flex items-center gap-1.5 text-sm mb-1">
                <input type="radio" name="winType" value="self" class="winTypeRadio" />
                自摸（其他三家付）
              </label>
              <label class="flex items-center gap-1.5 text-sm">
                <input type="radio" name="winType" value="discard" checked class="winTypeRadio" />
                胡牌（放槍者全付）
              </label>
            </div>

            <div id="discarderSection" class="hidden">
              <div class="text-xs text-gray-500 mb-1">放槍的人</div>
              <div class="flex flex-col gap-1">
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="discarder" value="0" class="discarderRadio" /><span data-role="name">玩家1</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="discarder" value="1" class="discarderRadio" /><span data-role="name">玩家2</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="discarder" value="2" class="discarderRadio" /><span data-role="name">玩家3</span></label>
                <label class="flex items-center gap-1.5 text-sm"><input type="radio" name="discarder" value="3" class="discarderRadio" /><span data-role="name">玩家4</span></label>
              </div>
            </div>

            <div>
              <label class="text-xs text-gray-500 block mb-1">常用設定</label>
              <select id="ratePreset" class="w-full border rounded px-2 py-1 text-sm mb-2">
                <option value="0">50 底 / 20 台</option>
                <option value="1">0 底 / 10 台</option>
                <option value="2">100 底 / 30 台</option>
                <option value="custom">自訂</option>
              </select>
              <div class="flex gap-2">
                <div class="flex-1">
                  <label class="text-xs text-gray-500 block mb-1">底</label>
                  <input type="number" min="0" id="flatBase" class="w-full border rounded px-2 py-1 text-sm" />
                </div>
                <div class="flex-1">
                  <label class="text-xs text-gray-500 block mb-1">每台</label>
                  <input type="number" min="0" id="unitPrice" class="w-full border rounded px-2 py-1 text-sm" />
                </div>
              </div>
              <p class="text-xs text-gray-400 mt-1">每人金額 = 底 + 台數 × 每台</p>
            </div>

            <button type="button" id="settleBtn" class="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium cursor-pointer">
              結算這局
            </button>
            <p class="text-xs text-gray-400">莊家贏或莊家放槍，自動加算莊家台（上莊1台、連莊N次是 2N+1 台）。分數只存在這台手機/瀏覽器裡。</p>
          </div>

          <div class="border rounded-lg p-4 bg-white shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h2 class="font-semibold text-sm">結算紀錄</h2>
              <button type="button" id="resetBtn" class="text-xs text-red-500 underline cursor-pointer">重設分數</button>
            </div>
            <div id="log"></div>
          </div>
        </aside>
      </div>
    </main>

    <script>
      // Tracks the 4 players sitting at the table (names, running totals, who's
      // dealer, wind seat) and settles each hand's money once you tell it the
      // tai count. All of this lives in localStorage only — there's no backend,
      // so it's private to this browser and survives page reloads but not
      // clearing site data.
      const STORAGE_KEY = "mahjong_game_state_v1"
      const DEFAULT_NAMES = ["Arance", "Ashley", "Harun", "Eva"]
      const WIND_LABELS = ["東", "南", "西", "北"]

      const RATE_PRESETS = [
        { label: "50 底 / 20 台", base: 50, perTai: 20 },
        { label: "0 底 / 10 台", base: 0, perTai: 10 },
        { label: "100 底 / 30 台", base: 100, perTai: 30 }
      ]

      const $ = (id) => document.getElementById(id)
      const all = (selector) => Array.from(document.querySelectorAll(selector))

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          if (raw) {
            const parsed = JSON.parse(raw)
            return {
              names: Array.isArray(parsed.names) && parsed.names.length === 4 ? parsed.names : [...DEFAULT_NAMES],
              totals: Array.isArray(parsed.totals) && parsed.totals.length === 4 ? parsed.totals : [0, 0, 0, 0],
              dealerIndex: Number.isInteger(parsed.dealerIndex) ? parsed.dealerIndex : 0,
              flatBase: typeof parsed.flatBase === "number" ? parsed.flatBase : 50,
              unitPrice: typeof parsed.unitPrice === "number" ? parsed.unitPrice : 20,
              round: Number.isInteger(parsed.round) ? parsed.round : 1,
              log: Array.isArray(parsed.log) ? parsed.log : [],
              dealerStreak: Number.isInteger(parsed.dealerStreak) ? parsed.dealerStreak : 0
            }
          }
        } catch (e) {
          // corrupt storage, fall through to defaults
        }
        return { names: [...DEFAULT_NAMES], totals: [0, 0, 0, 0], dealerIndex: 0, flatBase: 50, unitPrice: 20, round: 1, log: [], dealerStreak: 0 }
      }

      let state = load()

      function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
      }

      function renderLabels() {
        ;["dealerRadio", "winnerRadio", "discarderRadio"].forEach((cls) => {
          all("." + cls).forEach((el) => {
            const i = Number(el.value)
            const label = el.closest("label")
            const nameSpan = label?.querySelector("[data-role='name']")
            if (nameSpan) nameSpan.textContent = state.names[i]
          })
        })
      }

      function renderPlayers() {
        for (let i = 0; i < 4; i++) {
          $(`playerName-${i}`).value = state.names[i]

          const total = state.totals[i]
          const totalEl = $(`playerTotal-${i}`)
          totalEl.textContent = (total > 0 ? "+" : "") + total
          totalEl.classList.toggle("text-emerald-600", total > 0)
          totalEl.classList.toggle("text-red-600", total < 0)
          totalEl.classList.toggle("text-gray-500", total === 0)

          $(`playerWind-${i}`).textContent = WIND_LABELS[i]

          const isDealer = i === state.dealerIndex
          const card = $(`playerCard-${i}`)
          card.classList.toggle("border-amber-400", isDealer)
          card.classList.toggle("ring-2", isDealer)
          card.classList.toggle("ring-amber-200", isDealer)
          card.classList.toggle("bg-amber-50", isDealer)
          card.classList.toggle("border-gray-200", !isDealer)
          card.classList.toggle("bg-white", !isDealer)

          const streakEl = $(`dealerStreak-${i}`)
          if (isDealer && state.dealerStreak > 0) {
            streakEl.textContent = `連莊 x${state.dealerStreak}`
            streakEl.classList.remove("hidden")
          } else {
            streakEl.classList.add("hidden")
          }
        }

        all(".dealerRadio").forEach((el) => { el.checked = Number(el.value) === state.dealerIndex })
        $("flatBase").value = state.flatBase
        $("unitPrice").value = state.unitPrice
        renderLabels()
      }

      function updateDiscarderVisibility() {
        const selected = all(".winTypeRadio").find((r) => r.checked)
        const isDiscard = selected?.value === "discard"
        $("discarderSection").classList.toggle("hidden", !isDiscard)
      }

      // 胡牌的人不能同時是放槍的人，所以他自己那個選項要停用（如果剛好選到就取消勾選）。
      function onWinnerChange() {
        const winnerEl = all(".winnerRadio").find((r) => r.checked)
        const winnerIdx = winnerEl ? Number(winnerEl.value) : null

        all(".discarderRadio").forEach((el) => {
          const i = Number(el.value)
          const disable = i === winnerIdx
          el.disabled = disable
          if (disable && el.checked) el.checked = false
          const label = el.closest("label")
          label?.classList.toggle("opacity-40", disable)
          label?.classList.toggle("cursor-not-allowed", disable)
        })
      }

      function renderLog() {
        const logEl = $("log")
        if (state.log.length === 0) {
          logEl.innerHTML = `<p class="text-sm text-gray-400">還沒有結算紀錄</p>`
          return
        }

        logEl.innerHTML = state.log.map((entry) => `
          <div class="text-xs border-b py-1.5">
            <div>第 ${entry.round} 局・${entry.winner} ${entry.winType === "self" ? "自摸" : "胡牌"}・${entry.tai} 台${entry.dealerBonusTai ? `＋莊家台 ${entry.dealerBonusTai}` : ""}</div>
            <div class="text-gray-500">${entry.deltas.filter((d) => d.delta !== 0).map((d) => `${d.name} ${d.delta > 0 ? "+" : ""}${d.delta}`).join("　")}</div>
          </div>
        `).join("")
      }

      function settle() {
        const raw = $("taiInput").value.trim()
        const tai = Number(raw)
        if (raw === "" || Number.isNaN(tai) || tai < 0) {
          alert("請先在上面填入這把的台數（可以是 0 台）")
          return
        }

        const winnerEl = all(".winnerRadio").find((r) => r.checked)
        if (!winnerEl) { alert("請選擇胡牌的人"); return }
        const winnerIdx = Number(winnerEl.value)

        const winTypeEl = all(".winTypeRadio").find((r) => r.checked)
        const winType = winTypeEl ? winTypeEl.value : "self"

        const dealerIdx = state.dealerIndex
        // 莊家台：不管誰胡牌，莊家自己要付/收的那份錢永遠算進莊家台——
        // 上莊（連莊0次）1台，連莊N次是 2N+1 台（連莊1是3台、連莊2是5台...）。
        // 真正的閒家（不是莊家、也沒讓莊家参與這筆）只算原本的台數，不用加。
        const dealerBonusTai = 2 * state.dealerStreak + 1
        const basePayment = state.flatBase + tai * state.unitPrice
        const dealerPayment = state.flatBase + (tai + dealerBonusTai) * state.unitPrice
        const deltas = [0, 0, 0, 0]
        let discarderIdx = null
        let dealerInvolved

        if (winType === "self") {
          dealerInvolved = true
          for (let i = 0; i < 4; i++) {
            if (i === winnerIdx) continue
            const amount = (winnerIdx === dealerIdx || i === dealerIdx) ? dealerPayment : basePayment
            deltas[i] -= amount
            deltas[winnerIdx] += amount
          }
        } else {
          const discarderEl = all(".discarderRadio").find((r) => r.checked)
          if (!discarderEl) { alert("請選擇放槍的人"); return }
          discarderIdx = Number(discarderEl.value)
          if (discarderIdx === winnerIdx) { alert("放槍的人不能跟胡牌的人一樣"); return }
          dealerInvolved = winnerIdx === dealerIdx || discarderIdx === dealerIdx
          const amount = dealerInvolved ? dealerPayment : basePayment
          deltas[discarderIdx] -= amount
          deltas[winnerIdx] += amount
        }

        for (let i = 0; i < 4; i++) state.totals[i] += deltas[i]

        state.log.unshift({
          round: state.round,
          winner: state.names[winnerIdx],
          tai,
          dealerBonusTai: dealerInvolved ? dealerBonusTai : 0,
          winType,
          deltas: deltas.map((delta, i) => ({ name: state.names[i], delta }))
        })
        state.log = state.log.slice(0, 30)
        state.round += 1

        // 莊家連莊：胡牌的人是莊家就留任並累加連莊次數，否則換下一位（順序：0→1→2→3→0）並歸零
        if (winnerIdx === dealerIdx) {
          state.dealerStreak += 1
        } else {
          state.dealerIndex = (dealerIdx + 1) % 4
          state.dealerStreak = 0
        }

        persist()
        renderPlayers()
        renderLog()
        updateDiscarderVisibility()
        onWinnerChange()
        all(".winnerRadio").forEach((r) => { r.checked = false })
        all(".winTypeRadio").forEach((r) => { r.checked = r.value === "discard" })
        $("taiInput").value = ""
        updateDiscarderVisibility()
      }

      function resetScores() {
        if (!confirm("確定要重設所有人的分數嗎？這個動作無法復原。")) return
        state.totals = [0, 0, 0, 0]
        state.log = []
        state.round = 1
        state.dealerStreak = 0
        persist()
        renderPlayers()
        renderLog()
      }

      // wire up events
      for (let i = 0; i < 4; i++) {
        $(`playerName-${i}`).addEventListener("change", (e) => {
          state.names[i] = e.currentTarget.value.trim() || DEFAULT_NAMES[i]
          persist()
          renderLabels()
        })
      }

      all(".dealerRadio").forEach((el) => {
        el.addEventListener("change", (e) => {
          const newIndex = Number(e.currentTarget.value)
          if (newIndex !== state.dealerIndex) state.dealerStreak = 0
          state.dealerIndex = newIndex
          persist()
          renderPlayers()
        })
      })

      $("flatBase").addEventListener("change", (e) => {
        state.flatBase = Number(e.currentTarget.value) || 0
        $("ratePreset").value = "custom"
        persist()
      })

      $("unitPrice").addEventListener("change", (e) => {
        state.unitPrice = Number(e.currentTarget.value) || 0
        $("ratePreset").value = "custom"
        persist()
      })

      $("ratePreset").addEventListener("change", (e) => {
        const index = e.currentTarget.value
        if (index === "custom") return
        const preset = RATE_PRESETS[Number(index)]
        if (!preset) return
        state.flatBase = preset.base
        state.unitPrice = preset.perTai
        persist()
        renderPlayers()
      })

      all(".winTypeRadio").forEach((el) => el.addEventListener("change", updateDiscarderVisibility))
      all(".winnerRadio").forEach((el) => el.addEventListener("change", onWinnerChange))
      $("settleBtn").addEventListener("click", settle)
      $("resetBtn").addEventListener("click", resetScores)

      renderPlayers()
      renderLog()
      updateDiscarderVisibility()
      onWinnerChange()
    </script>
  </body>
</html>
